services:
  db:
    image: pgvector/pgvector:pg16
    container_name: examforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-examforge}
      POSTGRES_USER: ${DB_USER:-examforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-examforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - examforge_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-examforge} -d ${DB_NAME:-examforge}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  examforge_pgdata:
